name: Publicar extensão

on:
  push:
    branches: [main]
    paths: ["extensao/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Preparar chave de assinatura
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          node <<'JS'
          const fs = require("fs");
          const k = (process.env.CRX_PRIVATE_KEY || "").replace(/\r/g, "");
          if (!k.trim()) { console.log("::error::Cadastre o segredo CRX_PRIVATE_KEY (veja o README)."); process.exit(1); }
          const m = k.match(/-----BEGIN ([A-Z ]+)-----([\s\S]*?)-----END \1-----/);
          if (!m) { console.log("::error::A chave em CRX_PRIVATE_KEY está sem as linhas BEGIN/END. Cadastre a chave inteira."); process.exit(1); }
          const corpo = m[2].replace(/\s+/g, "");
          const pem = "-----BEGIN " + m[1] + "-----\n" + corpo.match(/.{1,64}/g).join("\n") + "\n-----END " + m[1] + "-----\n";
          try { require("crypto").createPrivateKey(pem); }
          catch (e) { console.log("::error::A chave em CRX_PRIVATE_KEY está incompleta ou corrompida. Gere uma nova e cadastre de novo."); process.exit(1); }
          fs.writeFileSync("chave.pem", pem);
          console.log("Chave válida.");
          JS

      - name: Montar, assinar e gerar arquivos de atualização
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/publicar.js

      - name: Apagar chave
        if: always()
        run: rm -f chave.pem

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
